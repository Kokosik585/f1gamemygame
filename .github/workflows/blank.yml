<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>F1 3D Grand Prix</title>
<style>
:root{color-scheme:dark;--bg:#0d0d10;--fg:#f4f4f5;--red:#e10600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,Arial,sans-serif;overflow:hidden}
canvas#c{display:block;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,14,.93);text-align:center;padding:12px;overflow:auto}
h1{margin:0 0 4px;font-size:clamp(26px,6vw,44px);font-style:italic}h1 b{color:var(--red)}
#g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;max-width:640px;width:100%;margin:14px 0}
button,select{background:#1c1c22;color:var(--fg);border:1px solid #333;border-left:4px solid var(--red);border-radius:6px;padding:10px;font-size:14px;cursor:pointer;text-align:left}
button:hover{background:#2a2a32}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;max-width:640px;width:100%}.sel{background:#2f2f3a;outline:2px solid #ffd400}.hide{display:none}
#hud{position:fixed;top:10px;left:10px;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.5;pointer-events:none}
#mm{position:fixed;top:10px;right:10px;background:rgba(0,0,0,.55);border-radius:6px}
#li{position:fixed;top:60px;left:0;right:0;text-align:center;pointer-events:none}
.l{display:inline-block;width:34px;height:34px;border-radius:50%;background:#400;margin:4px}.l.on{background:#f00}
#tc{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;pointer-events:none}
#tc div{pointer-events:auto;display:flex;gap:8px}
#tc button{width:58px;height:58px;font-size:18px;text-align:center;opacity:.75;border-radius:50%;border:2px solid #555;touch-action:none;padding:0}
table{border-collapse:collapse;margin:10px 0}td{padding:3px 10px;text-align:left}
</style></head><body>
<canvas id="c"></canvas><div id="hud" class="hide"></div><canvas id="mm" width="130" height="130" class="hide"></canvas><div id="li" class="hide"></div>
<div id="tc" class="hide"><div><button id="bl">◀</button><button id="br">▶</button></div><div><button id="bp">PIT</button><button id="bt">S/M/H</button><button id="bb">■</button><button id="bg">▲</button></div></div>
<div id="m" class="ov"><h1>🏁 F1 <b>3D GRAND PRIX</b></h1><div>10 circuits · 10 cars · pit stops &amp; tyres</div>
<div style="margin:12px 0 4px">Choose your car</div><div id="tm" class="gr"></div><div style="margin:12px 0 4px">Choose your driver</div><div id="dv" class="gr"></div><div style="margin:12px">Laps: <select id="ln"><option>5</option><option selected>10</option><option>20</option></select></div><div id="g"></div>
<small>↑/W gas · ↓/S brake · ←/→ steer · P = pit next lap · 1/2/3 = Soft/Medium/Hard for the stop · M = mute · Esc = menu<br>Drivers are fictional.<br>Tyres wear out. You must stop at least once (or +30 s penalty).<br>Fan-made, unofficial. Layouts are simplified versions of the real circuits.</small></div>
<div id="r" class="ov hide"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const N=500,PI2=Math.PI*2,VM=90,AC=54,BR=105,PS=22,PM=44,TW=13,PO=TW/2+13,PV=22;
let LAPS=10;
